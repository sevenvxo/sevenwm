# sevenwm config at ~/.config/sevenwm/config.toml
# anything u leave out uses the built in default
# mod+shift+r reloads it

# commands that run when sevenwm starts as ur session but not nested
autostart = []
# these run at start too and get restarted if they crash but a clean exit like sevenshell quit is left alone
keep_running = ["sevenshell"]

# what mod means in the binds below and when nested the host keeps super so sevenwm uses nested_mod_key
mod_key = "super"
nested_mod_key = "alt"

# how many pixels a window moves or grows per keypress
step = 50

# the canvas is a big plane of floating windows around ur workspaces
[canvas]
size = "infinite"              # or width and height in pixels centered on the first workspace
background = "#141418"         # colors are #rrggbb or #rrggbbaa
wallpaper = ""                 # path to an image or empty for none
wallpaper_mode = "fill"        # fill fit center stretch or tile
region_outline = "#ffffff26"   # workspace edges seen from the canvas
bounds_outline = "#ff555540"   # the edge of a limited canvas
drop_highlight = "#ffffff1a"   # a workspace that a dragged window would tile into

[tiling]
gaps_inner = 8                 # space between tiles
gaps_outer = 8                 # space between tiles and the workspace edge
split_ratio = 0.5              # how much of the space each split gives the earlier window
new_tile_position = "main"     # where a window entering a workspace goes main or end

# workspaces are numbered tiled areas on the canvas each the size of its monitor
# mod+number goes to one and mod+shift+plus or minus makes or removes one
# mod+ctrl+drag moves one and mod+ctrl+right click on its empty space changes its number
[workspaces]
gap = 80                       # space kept between workspaces
drag_modifier = "ctrl"         # hold this w mod to drag a workspace

[placement]
# where new windows go
# by-view tiles if ur looking at a workspace or floats where ur looking if not
# always-tile
# always-float
new_windows = "by-view"
float_size = [960, 640]        # size new floating windows open at

[snap]
enabled = true
gap = 8                        # space kept between snapped windows
threshold = 20                 # how close in pixels before an edge snaps

[view]
zoom_min = 0.1
zoom_max = 2.0
zoom_step = 1.1                # per scroll notch
fly_duration_ms = 250          # how long the view takes to fly somewhere and 0 js jumps
focus_follows_view = true      # focusing a window off screen flies the view to it
drag_empty_canvas_pans = true  # a plain drag on empty canvas pans
pan_modifier = "alt"           # hold this w mod to pan even over windows

# "combo" = "action". Modifiers: mod, super, alt, ctrl, shift.
# keys use xkb names like a-z 0-9 left right up down tab space return f1
# set an action to none to unbind a default
# actions
# exec command run a shell command
# exec-outside command run it and its window opens beside the workspace
# close-window ask the focused window to close
# quit exit sevenwm
# cycle-windows cycle focus most recent first
# home fly back to the workspace u were last in
# overview zoom out to see every window
# zoom-in zoom-out zoom around the middle of the screen
# center-window fly to the focused window at 100% zoom
# toggle-fullscreen
# toggle-maximize fill the screen but keep the bar
# toggle-floating float a tile or tile a floating window
# toggle-tiling move a window into a workspace or back out beside it
# workspace n fly to workspace n from 1 to 10
# move-to-workspace n tile the focused window in workspace n
# new-workspace make a workspace next to the one ur in
# remove-workspace remove the workspace ur in and float its tiles
# collapse fold the window into a marker or bring one back
# focus dir focus the nearest window that way
# move dir move the focused window
# grow dir push that edge of the window out
# shrink dir pull that edge of the window in
# relaunch-window kill the app and start it again
# reload-config
# screenshot freeze the screen and pick an area
# mouse
# mod + left drag move a window and drop it on a workspace to tile it
# mod + right drag resize a floating window from its nearest corner
# mod + right click window menu and hover workspace for its menu
# mod + ctrl + right click workspace menu on its empty space
# mod + ctrl + left drag move a workspace and its tiles
# mod + alt + left drag pan the view even over windows
# left drag on empty canvas pan the view
# mod + scroll zoom around the cursor

[output]
# the monitor mode like 1920x1080@240 and auto picks its best res at the highest refresh
mode = "auto"

[xwayland]
# x11 apps like steam and most games run thru xwayland-satellite
enabled = true
path = "xwayland-satellite"

# mouse and touchpad settings only apply on real hardware but keyboard ones always do
[input.keyboard]
layout = "us"                  # xkb layouts like us and more split by commas
variant = ""
options = ""                   # xkb options like capsescape
model = ""
repeat_rate = 25               # repeats per second
repeat_delay = 200             # ms before repeating starts

[input.mouse]
accel_profile = "flat"         # flat is 1:1 and adaptive makes fast moves go further
accel_speed = 0.0              # from -1.0 to 1.0
natural_scroll = false
left_handed = false

[input.touchpad]
accel_profile = "adaptive"
accel_speed = 0.0
natural_scroll = true
left_handed = false
tap = true                     # tap to click
disable_while_typing = true

[idle]
# seconds w no input before each of these happens and 0 means never but video holds them off
lock_after = 300
screen_off_after = 300
suspend_after = 600
# what locks the screen when idle and again if the lock screen crashes so u never get stuck locked
lock_command = "sevenshell lock"
suspend_command = "systemctl suspend"

[border]
width = 2                      # 0 for none and it scales w zoom
focused = "#ffffff"
unfocused = "#ffffff40"

# rounded corners and uhh shadows drawn by sevenwm that scale w zoom
[decorations]
corner_radius = 10             # pixels and 0 means square corners
shadow = true
shadow_on_tiles = false        # tiles sit flat and floating windows get a shadow
shadow_size = 24               # how far the shadow fades out
shadow_offset = [0, 6]         # x y offset so the shadow falls a bit below the window
shadow_color = "#00000080"
# sevenwms own title bars w float collapse and close buttons but gtk apps keep their own
titlebar = false
titlebar_height = 28
titlebar_focused = "#2a2a32"
titlebar_unfocused = "#1a1a1f"
titlebar_text = "#ebebeb"

# the pointer which sevenwm draws so its the same everywhere
[cursor]
theme = "default"              # a theme in ~/.icons or /usr/share/icons
size = 24                      # pixels and the theme image gets scaled to fit

# colors for sevenwms own menu and the settings app has presets
[theme]
preset = "default"
menu_background = "#1e1e24"
menu_text = "#ebebeb"
menu_hover = "#3a3a44"
menu_disabled = "#787880"
menu_edge = "#50505a"

# per monitor settings by connector name and monitors without one sit left to right
# [[monitors]]
# name = "HDMI-A-1"
# position = [0, 0]
# mode = "1920x1080@240"
# scale = 1.0

[animations]
enabled = true
# curves linear ease-out-quad ease-out-cubic ease-out-expo ease-in-out-cubic back spring
# styles none fade zoom pop slide
# the settings app previews them under appearance
move_ms = 180                  # windows sliding to a new spot
move_curve = "ease-out-cubic"
open_style = "zoom"            # new windows showing up
open_ms = 180
open_curve = "ease-out-cubic"
close_style = "zoom"           # closed windows going away
close_ms = 150
close_curve = "ease-out-quad"
fly_curve = "ease-out-cubic"   # the view flying and its length is view.fly_duration_ms

# mod+n folds the window into a small marker and u click the marker to get it back
[collapse]
auto_after_minutes = 0         # also collapse floating windows off screen that went unused this long and 0 means never

# the layout gets saved to ~/.local/state/sevenwm/session.json so windows go back to their spots after a restart
[session]
restore = true
restore_within_seconds = 120   # windows opening later than this after startup get placed as new

# window rules for windows matching an app id or title
# patterns use * for anything and ? for one char and later rules win
# an app id is usually its binary or .desktop name like kitty
#
# [[rules]]
# app_id = "pavucontrol"
# float = true                 # always float and false means always tile
# size = [900, 600]            # its size when it floats
#
# [[rules]]
# title = "*Picture-in-Picture*"
# float = true
# hide_from_screencast = true

[screenshot]
# runs on mod+shift+s and it should pick an area and capture it
command = "grim -g \"$(slurp -d)\" - | wl-copy --type image/png"
freeze = true                  # show a still of the screen while u pick

[keybindings]
"mod+t" = "exec kitty"
"mod+q" = "close-window"
"mod+d" = "exec sevenshell launcher"
"mod+g" = "exec sevenshell windows"     # find an open window by name
"mod+m" = "quit"
"alt+tab" = "cycle-windows"
"mod+tab" = "overview"
"mod+equal" = "zoom-in"            # the + key
"mod+minus" = "zoom-out"
"mod+KP_Add" = "zoom-in"
"mod+KP_Subtract" = "zoom-out"
"mod+shift+equal" = "new-workspace"     # mod+shift+plus
"mod+shift+KP_Add" = "new-workspace"
"mod+shift+minus" = "remove-workspace"
"mod+shift+KP_Subtract" = "remove-workspace"
"mod+s" = "home"
"mod+n" = "collapse"
"mod+ctrl+f" = "center-window"    # center the focused window at 100% zoom
"mod+1" = "workspace 1"
"mod+2" = "workspace 2"
"mod+3" = "workspace 3"
"mod+4" = "workspace 4"
"mod+5" = "workspace 5"
"mod+6" = "workspace 6"
"mod+7" = "workspace 7"
"mod+8" = "workspace 8"
"mod+9" = "workspace 9"
"mod+0" = "workspace 10"
"mod+shift+1" = "move-to-workspace 1"
"mod+shift+2" = "move-to-workspace 2"
"mod+shift+3" = "move-to-workspace 3"
"mod+shift+4" = "move-to-workspace 4"
"mod+shift+5" = "move-to-workspace 5"
"mod+shift+6" = "move-to-workspace 6"
"mod+shift+7" = "move-to-workspace 7"
"mod+shift+8" = "move-to-workspace 8"
"mod+shift+9" = "move-to-workspace 9"
"mod+shift+0" = "move-to-workspace 10"
"mod+e" = "exec thunar"
"mod+w" = "exec gtk-launch \"$(xdg-settings get default-web-browser)\""
"mod+shift+s" = "screenshot"
"mod+f" = "toggle-fullscreen"
"mod+shift+f" = "toggle-maximize"      # fill the screen but keep the bar
"mod+space" = "toggle-floating"
"mod+ctrl+space" = "toggle-tiling"
"mod+r" = "relaunch-window"
"mod+shift+r" = "reload-config"
"mod+i" = "exec sevenwm-settings"
"mod+escape" = "exec sevenshell lock"
"mod+slash" = "exec sevenshell keybinds"
"mod+shift+t" = "exec-outside kitty"   # these four open beside the workspace
"mod+shift+w" = "exec-outside gtk-launch \"$(xdg-settings get default-web-browser)\""
"mod+shift+e" = "exec-outside thunar"
"mod+shift+i" = "exec-outside sevenwm-settings"

"mod+h" = "focus left"
"mod+k" = "focus up"
"mod+j" = "focus down"
"mod+l" = "focus right"
"mod+left" = "focus left"
"mod+down" = "focus down"
"mod+up" = "focus up"
"mod+right" = "focus right"

