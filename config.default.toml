"mod+alt+right" = "shrink right"

# media keys work while locked and repeat while held
"XF86AudioRaiseVolume" = "exec sevenshell volume up"
"XF86AudioLowerVolume" = "exec sevenshell volume down"
"XF86AudioMute" = "exec sevenshell volume mute"
"XF86AudioMicMute" = "exec sevenshell mic mute"
"XF86MonBrightnessUp" = "exec sevenshell brightness up"
"XF86MonBrightnessDown" = "exec sevenshell brightness down"
"XF86AudioPlay" = "exec playerctl play-pause"
"XF86AudioPause" = "exec playerctl play-pause"
"XF86AudioNext" = "exec playerctl next"
"XF86AudioPrev" = "exec playerctl previous"
